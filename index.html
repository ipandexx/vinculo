<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>VÍNCULO — RPG Online</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧭</text></svg>">
<style>
  :root{
    --ouro:#d9b45a; --ouro-claro:#f3d98a; --texto:#f1e9d6; --suave:rgba(241,233,214,.72);
    --painel:rgba(10,9,20,.72); --linha:rgba(217,180,90,.35);
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{
    font-family:'Trajan Pro','Cinzel',Georgia,'Times New Roman',serif;
    color:var(--texto); background:#0b0a14; overflow:hidden;
    padding-top:env(safe-area-inset-top,0); padding-bottom:env(safe-area-inset-bottom,0);
  }
  .tela{position:relative; height:100vh; height:100dvh; width:100%; overflow:hidden}
  .fundo{position:absolute; top:0; left:0; right:0; bottom:0; width:100%; height:100%; object-fit:cover; object-position:center 30%}
  .veu{position:absolute; top:0; left:0; right:0; bottom:0; background:linear-gradient(180deg, rgba(6,6,14,.55) 0%, rgba(6,6,14,.08) 30%, rgba(6,6,14,.12) 60%, rgba(6,6,14,.75) 100%)}

  .topo{position:absolute; top:0; left:0; right:0; display:flex; justify-content:space-between; align-items:center; padding:calc(env(safe-area-inset-top,0) + 14px) 16px 0; z-index:5}
  .marca-topo{display:flex; align-items:center; gap:8px; font-size:.72rem; letter-spacing:.14em; color:var(--suave); text-transform:uppercase}
  .marca-topo svg{width:16px; height:16px; flex:none}
  .controles{display:flex; gap:10px}
  .icone-btn{width:34px; height:34px; padding:0; border:0; background:none; cursor:pointer; -webkit-tap-highlight-color:transparent}
  .icone-btn img{width:100%; height:100%; object-fit:contain; filter:drop-shadow(0 2px 6px rgba(0,0,0,.5))}
  .icone-btn:active img{transform:scale(.92)}

  .centro{position:absolute; top:0; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:0 20px; text-align:center; z-index:3}
  .centro-conteudo{width:100%; max-width:360px; display:flex; flex-direction:column; align-items:center}
  .logo{width:100%; max-height:34vh; object-fit:contain; filter:drop-shadow(0 6px 30px rgba(0,0,0,.55))}
  .subtitulo{margin-top:2px; font-size:.68rem; letter-spacing:.32em; color:var(--suave); text-transform:uppercase}

  .btn-jornada{position:relative; margin-top:20px; cursor:pointer; width:70%; max-width:250px; -webkit-tap-highlight-color:transparent}
  .btn-jornada::before{content:"";position:absolute; left:6%; right:6%; top:14%; bottom:14%; background:linear-gradient(180deg, rgba(12,10,8,.72), rgba(12,10,8,.85)); border-radius:2px}
  .btn-jornada img{position:relative; width:100%; display:block; filter:drop-shadow(0 4px 18px rgba(0,0,0,.5))}
  .btn-jornada span{position:absolute; top:0; left:0; right:0; bottom:0; display:flex; align-items:center; justify-content:center; font-size:.92rem; letter-spacing:.16em; color:var(--ouro-claro); text-transform:uppercase; text-shadow:0 1px 6px rgba(0,0,0,.6)}
  .btn-jornada:active{transform:translateY(1px)}
  .btn-jornada:active img{filter:drop-shadow(0 2px 8px rgba(0,0,0,.5)) brightness(.92)}

  .rodape{position:absolute; left:0; right:0; bottom:0; display:flex; flex-direction:column; align-items:center; gap:8px; padding:0 16px calc(env(safe-area-inset-bottom,0) + 14px); z-index:4}
  .tagline{width:56%; max-width:230px; opacity:.9}
  .divisor{width:78%; max-width:320px; opacity:.55}

  .painel-config{position:fixed; top:0; left:0; right:0; bottom:0; z-index:20; display:flex; align-items:flex-end; justify-content:center; background:rgba(4,4,10,.55); opacity:0; pointer-events:none; transition:opacity .25s ease}
  .painel-config.aberto{opacity:1; pointer-events:auto}
  .caixa-config{width:100%; max-width:480px; max-height:82dvh; overflow-y:auto; background:var(--painel); backdrop-filter:blur(10px); border:1px solid var(--linha); border-radius:20px 20px 0 0; padding:20px 20px calc(env(safe-area-inset-bottom,0) + 24px); transform:translateY(100%); transition:transform .3s ease}
  .painel-config.aberto .caixa-config{transform:translateY(0)}
  .cabecalho-config{display:flex; justify-content:space-between; align-items:center; margin-bottom:18px}
  .cabecalho-config h2{margin:0; font-size:1.1rem; letter-spacing:.1em; color:var(--ouro-claro); text-transform:uppercase}
  .fechar-config{background:none; border:1px solid var(--linha); color:var(--texto); width:30px; height:30px; border-radius:50%; font-size:1rem; line-height:1; cursor:pointer}
  .grupo{margin-bottom:20px}
  .grupo p.rotulo{margin:0 0 8px; font-size:.78rem; letter-spacing:.08em; color:var(--suave); text-transform:uppercase; font-family:Georgia,serif}
  .opcoes{display:flex; gap:6px; flex-wrap:wrap}
  .opcoes button{flex:1; min-width:70px; padding:9px 6px; background:rgba(255,255,255,.04); border:1px solid var(--linha); border-radius:8px; color:var(--suave); font-size:.78rem; font-family:Georgia,serif; cursor:pointer}
  .opcoes button.ativo{background:rgba(217,180,90,.16); border-color:var(--ouro); color:var(--ouro-claro)}
  .slider-linha{display:flex; align-items:center; gap:10px; margin-bottom:10px; font-size:.82rem; color:var(--suave); font-family:Georgia,serif}
  .slider-linha span{width:64px; flex:none}
  .slider-linha input[type=range]{flex:1; accent-color:var(--ouro)}

  @media (prefers-reduced-motion:no-preference){
    .logo{animation:surgir .9s ease both}
    .subtitulo,.btn-jornada,.rodape{animation:surgir .9s ease both}
    .subtitulo{animation-delay:.15s} .btn-jornada{animation-delay:.3s} .rodape{animation-delay:.45s}
    @keyframes surgir{from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:none}}
  }
</style>
</head>
<body>
<div class="tela">
  <img class="fundo" src="home-fundo.jpg" alt="">
  <div class="veu"></div>

  <div class="topo">
    <div class="marca-topo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M12 2v20M2 12h20M5 5l14 14M19 5L5 19"/></svg>
      VÍNCULO RPG ONLINE
    </div>
    <div class="controles">
      <button class="icone-btn" id="btn-som" aria-label="Som"><img id="img-som" src="icone-som-ligado-normal.png" alt=""></button>
      <button class="icone-btn" id="btn-config" aria-label="Configurações"><img id="img-config" src="icone-config-normal.png" alt=""></button>
    </div>
  </div>

  <div class="centro">
    <div class="centro-conteudo">
      <img class="logo" src="vinculo-logo-oficial.png" alt="VÍNCULO RPG ONLINE">
      <div class="btn-jornada" id="btn-jornada" role="button" tabindex="0">
        <img src="botao-inicie-sua-jornada.png" alt="">
        <span>Inicie sua jornada</span>
      </div>
    </div>
  </div>

  <div class="rodape">
    <img class="divisor" src="ornamento-divisor.png" alt="">
    <img class="tagline" src="tagline.png" alt="Grandes histórias nascem de conexões">
  </div>
</div>

<div class="painel-config" id="painel-config">
  <div class="caixa-config">
    <div class="cabecalho-config">
      <h2>Configurações</h2>
      <button class="fechar-config" id="fechar-config">✕</button>
    </div>

    <div class="grupo">
      <p class="rotulo">Qualidade visual</p>
      <div class="opcoes" data-grupo="qualidade">
        <button data-valor="auto" class="ativo">Automático</button>
        <button data-valor="low">Suave</button>
        <button data-valor="medium">Mediano</button>
        <button data-valor="high">Máxima</button>
      </div>
    </div>

    <div class="grupo">
      <p class="rotulo">Áudio</p>
      <div class="slider-linha"><span>Geral</span><input type="range" min="0" max="100" value="100"></div>
      <div class="slider-linha"><span>Música</span><input type="range" min="0" max="100" value="70"></div>
      <div class="slider-linha"><span>Ambiente</span><input type="range" min="0" max="100" value="60"></div>
      <div class="slider-linha"><span>Efeitos</span><input type="range" min="0" max="100" value="50"></div>
    </div>
  </div>
</div>

<script>
const somBtn = document.getElementById('btn-som');
const somImg = document.getElementById('img-som');
let somLigado = true;
somBtn.addEventListener('click', () => {
  somLigado = !somLigado;
  somImg.src = somLigado ? 'icone-som-ligado-normal.png' : 'icone-som-desligado-normal.png';
});

const configBtn = document.getElementById('btn-config');
const configImg = document.getElementById('img-config');
const painel = document.getElementById('painel-config');
configBtn.addEventListener('click', () => {
  painel.classList.add('aberto');
  configImg.src = 'icone-config-pressed.png';
});
document.getElementById('fechar-config').addEventListener('click', () => {
  painel.classList.remove('aberto');
  configImg.src = 'icone-config-normal.png';
});

document.querySelectorAll('.opcoes').forEach(grupo => {
  grupo.querySelectorAll('button').forEach(b => {
    b.addEventListener('click', () => {
      grupo.querySelectorAll('button').forEach(x => x.classList.remove('ativo'));
      b.classList.add('ativo');
    });
  });
});

document.getElementById('btn-jornada').addEventListener('click', () => {
  window.location.href = 'login.html';
});
document.getElementById('btn-jornada').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); window.location.href = 'login.html'; }
});
</script>
</body>
</html>
